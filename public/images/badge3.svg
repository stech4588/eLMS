<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gold-grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow-gold3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Seal Shape -->
  <path d="M50 2
           L55 15 L70 15 L75 30 L90 35
           L85 50 L90 65 L75 70 L70 85
           L55 85 L50 98 L45 85 L30 85
           L25 70 L10 65 L15 50 L10 35
           L25 30 L30 15 L45 15 Z"
        fill="url(#gold-grad3)" filter="url(#drop-shadow-gold3)" stroke="#B8860B" stroke-width="1"/>

  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="30" fill="url(#gold-grad3)" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <!-- Book Icon -->
  <path d="M40 35 L60 35 L60 65 L40 65 Z" fill="none" stroke="#B8860B" stroke-width="3"/>
  <line x1="50" y1="35" x2="50" y2="65" stroke="#B8860B" stroke-width="1.5"/>
  <path d="M42 45 L50 42 L58 45" fill="none" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 55 L50 52 L58 55" fill="none" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/>

</svg>
