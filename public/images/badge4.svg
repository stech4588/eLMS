<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bronze-grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow-bronze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="45" fill="url(#bronze-grad2)" filter="url(#drop-shadow-bronze)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#FFF" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Star with upward arrow -->
  <path d="M50,35 l5,10 h12 l-10,7 4,12 -11,-8 -11,8 4,-12 -10,-7 h12 z" fill="#FFF"/>
  <path d="M50 65 L 50 80 M 45 70 L 50 65 L 55 70" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
