<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ribbon -->
  <path d="M 20 60 L 20 95 L 35 80 L 50 95 L 65 80 L 80 95 L 80 60 Z" fill="#C0392B" filter="url(#drop-shadow)"/>
  <path d="M 20 60 L 50 75 L 80 60 L 50 45 Z" fill="#E74C3C"/>

  <!-- Main Seal -->
  <circle cx="50" cy="50" r="40" fill="url(#gold-grad)" filter="url(#drop-shadow)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FFF" stroke-width="1" stroke-opacity="0.5"/>
  
  <!-- Star -->
  <path d="M50,32 l5.8,11.8 13,1.9 -9.4,9.2 2.2,13 -11.6,-6.1 -11.6,6.1 2.2,-13 -9.4,-9.2 13,-1.9 z" fill="#FFF" />
</svg>
